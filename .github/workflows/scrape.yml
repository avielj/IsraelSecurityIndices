name: Scrape Indices

# The scheduled run was REMOVED on 2026-09-04.
#
# bizportal.co.il does not serve GitHub's US-hosted runners. This workflow ran
# every 15 minutes for months, "succeeded" every time, and wrote "—" for all
# five indices because the scraper swallowed every exception and exited 0. The
# widget dutifully displayed dashes.
#
# Verified the same day: identical code returns real prices from an Israeli IP.
# The scraper now runs on the Israeli VPS (tv-linux, cron every 15 min during
# market hours) and pushes data.json here directly. See scraper/fetch_indices.py.
#
# Re-enabling the schedule here would overwrite the VPS data — don't, unless
# bizportal starts serving GitHub runners again.

on:
  workflow_dispatch: # manual only

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install curl-cffi

      - name: Run scraper
        run: python scraper/fetch_indices.py

      - name: Commit data.json if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "chore: update index data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
