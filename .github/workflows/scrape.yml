name: Scrape Indices

# RETIRED 2026-09-04 — this workflow no longer scrapes anything.
#
# Why: bizportal.co.il does not serve GitHub's US-hosted runners. This job ran
# every 15 minutes for months, reported success every time, and wrote "—" for
# all five indices, because the scraper caught every exception and exited 0.
# The iPhone widget faithfully displayed dashes.
#
# The scraper now runs on the Israeli VPS (user tv-linux, cron every 15 min
# during TASE hours) and pushes data.json to this repo directly.
#   VPS path: /home/tv-linux/israel-indices-watch/
#
# The steps are kept as a no-op on purpose. Something outside this repo calls
# the workflow_dispatch API on a 15-minute cadence (3108 dispatch runs vs 453
# scheduled ones as of 2026-09-04) and has not been located yet. Leaving a real
# job here would either email a failure every 15 minutes or overwrite the VPS
# data with dashes. A green no-op does neither.
#
# Do NOT restore the scraping steps unless bizportal starts serving GitHub
# runners — verify first, from a runner, that data.json comes back with ok=true.

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Explain that scraping moved to the VPS
        run: |
          echo "Scraping moved to the Israeli VPS on 2026-09-04."
          echo "bizportal.co.il does not serve GitHub US runners."
          echo "data.json is pushed here by /home/tv-linux/israel-indices-watch/run-scrape.sh"
          echo "This workflow is intentionally a no-op."
